name: ci-action

# Smoke test of the ci action: it installs the benchpod CLI from its latest release for this
# runner and runs `benchpod ci --help` through the action's run step. No pod is touched. The
# step may fail (a CLI release without `benchpod ci`); what is checked is that the CLI got
# installed and the outputs were written either way.
on:
  pull_request:
    paths: ['ci/**', '.github/workflows/ci-action.yml']
  push:
    branches: [main]
    paths: ['ci/**', '.github/workflows/ci-action.yml']

permissions:
  contents: read

jobs:
  smoke:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A suite file for the action to look at
        run: |
          printf 'version: 1\nsuite: smoke\ndut: none\nsteps:\n  - wait: 1ms\n' > benchpod-ci.yaml
      - id: ci
        continue-on-error: true
        uses: ./ci
        with:
          extra-args: --help
      - name: The action ran the CLI
        env:
          CODE: ${{ steps.ci.outputs.exit-code }}
          RUN_DIR: ${{ steps.ci.outputs.run-dir }}
        run: |
          benchpod --version
          echo "benchpod ci --help exited with $CODE"
          test -n "$CODE"
          test -n "$RUN_DIR"
          if benchpod ci --help >/dev/null 2>&1; then test "$CODE" = 0; fi
