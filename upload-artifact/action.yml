name: 'EmbeddedCI Upload Firmware Artifact'
description: 'Publish a built firmware to embeddedci.com so it can be flashed from the web UI'
author: 'EmbeddedCI'

# Composite rather than a bundled Node action on purpose: the upload protocol (GitHub
# OIDC minting, session-token exchange, build creation, artifact upload, flash-wiring
# defaults) already exists and is tested in the Python SDK, and is the same code path the
# pytest `build_report` fixture uses. Wrapping it keeps one implementation instead of a
# second one in JavaScript that could drift from the server.

inputs:
  firmware:
    description: 'Path to the built firmware (.elf/.bin/.hex). Siblings with the same stem are uploaded too.'
    required: true
  build_target:
    description: 'Platform id recorded against the build, e.g. stm32f4. Shown on the Builds page.'
    required: false
    default: ''
  openocd_target:
    description: 'OpenOCD target config for the DUT, e.g. target/stm32f4x.cfg. Pre-fills the flash dialog.'
    required: false
    default: ''
  swclk:
    description: 'LA channel wired to SWCLK (1-12). Pre-fills the flash dialog.'
    required: false
    default: ''
  swdio:
    description: 'LA channel wired to SWDIO (1-12). Pre-fills the flash dialog.'
    required: false
    default: ''
  nreset:
    description: >-
      true when the target's NRST is wired to the pod's reset pin (DUT header
      J1 pin 22). Leave empty when NRST is not wired. This used to be an LA
      channel number, before pods had a reset pin of their own; a number is
      still accepted and read as "wired".
    required: false
    default: ''
  efuse:
    description: 'Target-power eFuse rail: 1 = internal 5V, 2 = external.'
    required: false
    default: ''
  name:
    description: 'Build name shown in the web UI. Defaults to the server-side commit summary.'
    required: false
    default: ''
  api_base:
    description: 'EmbeddedCI base URL. Defaults to the public server.'
    required: false
    default: ''
  sdk_ref:
    description: >-
      Git ref (tag, branch or commit) of embeddedci-python to install instead of the pinned
      PyPI release (embeddedci==2.5.*), e.g. to try an unreleased fix. Pin a tag or a commit
      for reproducible runs. Empty (the default) installs the PyPI release.
    required: false
    default: ''
  python_version:
    description: 'Python to set up for the upload step.'
    required: false
    default: '3.12'
  allow_missing_token:
    description: 'Succeed instead of failing when no OIDC token is available (e.g. a fork PR).'
    required: false
    default: 'false'

outputs:
  build_id:
    description: 'The embeddedci build id the artifacts were attached to'
    value: ${{ steps.upload.outputs.build_id }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    # Every input reaches bash through env: and is quoted there. An input expression pasted
    # into run: would let a crafted value (a branch name in a build path, say) run shell
    # commands in a job that holds id-token: write.
    - name: Install the embeddedci SDK
      shell: bash
      env:
        SDK_REF: ${{ inputs.sdk_ref }}
      run: |
        if [ -n "$SDK_REF" ]; then
          pkg="embeddedci @ git+https://github.com/embeddedci-com/embeddedci-python.git@${SDK_REF}#subdirectory=packages/embeddedci"
        else
          pkg="embeddedci==2.5.*"
        fi
        pip install --quiet "$pkg"

    - name: Publish firmware to embeddedci
      id: upload
      shell: bash
      env:
        # Auth is the job's OIDC token; the workflow must grant `id-token: write`.
        # Failing here with a clear message beats uploading nothing silently.
        EMBEDDEDCI_ALLOW_MISSING_TOKEN: ${{ inputs.allow_missing_token }}
        IN_FIRMWARE: ${{ inputs.firmware }}
        IN_BUILD_TARGET: ${{ inputs.build_target }}
        IN_OPENOCD_TARGET: ${{ inputs.openocd_target }}
        IN_SWCLK: ${{ inputs.swclk }}
        IN_SWDIO: ${{ inputs.swdio }}
        IN_NRESET: ${{ inputs.nreset }}
        IN_EFUSE: ${{ inputs.efuse }}
        IN_NAME: ${{ inputs.name }}
        IN_API_BASE: ${{ inputs.api_base }}
      run: |
        args=(--firmware "$IN_FIRMWARE")
        [ -n "$IN_BUILD_TARGET" ]   && args+=(--build-target   "$IN_BUILD_TARGET")
        [ -n "$IN_OPENOCD_TARGET" ] && args+=(--openocd-target "$IN_OPENOCD_TARGET")
        [ -n "$IN_SWCLK" ]  && args+=(--swclk  "$IN_SWCLK")
        [ -n "$IN_SWDIO" ]  && args+=(--swdio  "$IN_SWDIO")
        [ -n "$IN_NRESET" ] && args+=(--nreset "$IN_NRESET")
        [ -n "$IN_EFUSE" ]  && args+=(--efuse  "$IN_EFUSE")
        [ -n "$IN_NAME" ]   && args+=(--name   "$IN_NAME")
        [ -n "$IN_API_BASE" ] && args+=(--api-base "$IN_API_BASE")
        [ "$EMBEDDEDCI_ALLOW_MISSING_TOKEN" = "true" ] && args+=(--allow-missing-token)
        embeddedci-upload-build "${args[@]}"
