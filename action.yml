name: 'EmbeddedCI Submit Job'
description: 'Submit a pipeline definition or source archive to the EmbeddedCI server'
author: 'EmbeddedCI'

inputs:
  api_key:
    description: 'API key for EmbeddedCI (use secrets.EMBEDDEDCI_API_KEY)'
    required: true
  api_url:
    description: 'EmbeddedCI server base URL (e.g. https://api.embeddedci.com)'
    required: false
    default: 'https://api.embeddedci.com'
  source_path:
    description: 'Path to source archive file OR directory (including ".") for archive mode'
    required: false
    default: ''
  embeddedci_yaml:
    description: 'Pipeline YAML path. In YAML-only mode, this is the repo file path. In archive mode, this optionally overrides auto-detection.'
    required: false
    default: ''

outputs:
  job_id:
    description: 'Submitted job id'
  job_status:
    description: 'Submitted job status when provided by server'
  job_builds:
    description: 'JSON-encoded builds payload when provided by server'
  source_metadata:
    description: 'JSON-encoded source metadata when provided by server'

runs:
  using: 'node24'
  main: 'dist/index.js'
